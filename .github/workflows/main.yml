name: Build Courier Money APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q CourierMoney.zip -d project

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Check API key secret
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: |
          if [ -z "$ORS_API_KEY" ]; then
            echo "ORS_API_KEY secret is missing"
            exit 1
          fi
          echo "ORS_API_KEY is configured"

      - name: Build APK
        working-directory: project
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CourierMoney-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
